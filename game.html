<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — a tiny browser game built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1026; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; }
  canvas { width: 100%; height: 100%; display: block; background: #0b1026; border-radius: 12px; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
          color: #8f9bb3; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">Move with mouse, touch, or arrow keys — catch the stars, don't drop them.</div>
</div>
<script>
  // Star Catcher: a tiny browser game. Move the basket, catch falling stars.
  // Catch a star: +10 points. Drop a star: lose a life. 3 lives. Level up every 10 catches.
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const basket = { x: W / 2, y: H - 90, w: 110, h: 26, speed: 9 };
  let stars = [];
  let score = 0, caught = 0, lives = 3, level = 1;
  let best = 0;
  try { best = Number(window.localStorage.getItem('star-catcher-best') || 0) || 0; } catch (e) { best = 0; }
  let state = 'play'; // 'play' | 'over'
  let spawnTimer = 0, frame = 0;
  const keys = {};

  function rand(min, max) { return min + Math.random() * (max - min); }

  function spawnStar() {
    stars.push({
      x: rand(30, W - 30),
      y: -20,
      r: rand(11, 17),
      speed: rand(2.4, 3.6) + level * 0.35,
      sway: rand(0, Math.PI * 2),
      points: 10,
    });
  }

  function drawStar(x, y, r, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = (i * Math.PI) / 5 - Math.PI / 2;
      const rad = i % 2 === 0 ? r : r * 0.45;
      ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(ang) * rad, Math.sin(ang) * rad);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1026');
    g.addColorStop(1, '#1b2a52');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 137.5) % W, sy = (i * 89.3) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawBasket() {
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.roundRect(basket.x - basket.w / 2, basket.y, basket.w, basket.h, 8);
    ctx.fill();
    ctx.fillStyle = '#f4a261';
    ctx.fillRect(basket.x - basket.w / 2, basket.y, basket.w, 6);
  }

  function drawHud() {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 20, 46);
    ctx.textAlign = 'right';
    ctx.fillText('LEVEL ' + level, W - 20, 46);
    ctx.textAlign = 'left';
    ctx.font = '28px system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('BEST ' + Math.max(best, score), 20, 118);
    ctx.textAlign = 'left';
    ctx.font = '28px system-ui, sans-serif';
    ctx.fillText('♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives)), 20, 84);
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(5, 8, 20, 0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 54px system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.font = '32px system-ui, sans-serif';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 30);
    ctx.font = '26px system-ui, sans-serif';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('Click or press R to play again', W / 2, H / 2 + 90);
  }

  function update() {
    if (state !== 'play') return;
    frame++;
    if (keys['ArrowLeft'] || keys['a']) basket.x -= basket.speed;
    if (keys['ArrowRight'] || keys['d']) basket.x += basket.speed;
    basket.x = Math.max(basket.w / 2, Math.min(W - basket.w / 2, basket.x));

    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnStar();
      spawnTimer = Math.max(14, 46 - level * 4);
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.speed;
      s.x += Math.sin(frame / 28 + s.sway) * 0.7;
      const caughtStar =
        s.y + s.r >= basket.y &&
        s.y - s.r <= basket.y + basket.h &&
        s.x >= basket.x - basket.w / 2 &&
        s.x <= basket.x + basket.w / 2;
      if (caughtStar) {
        score += s.points;
        caught++;
        if (caught % 10 === 0) level++;
        stars.splice(i, 1);
      } else if (s.y - s.r > H) {
        lives--;
        stars.splice(i, 1);
        if (lives <= 0) {
          state = 'over';
          if (score > best) {
            best = score;
            try { window.localStorage.setItem('star-catcher-best', String(best)); } catch (e) {}
          }
        }
      }
    }
  }

  function render() {
    drawBackground();
    for (const s of stars) drawStar(s.x, s.y, s.r, '#ffe66d');
    drawBasket();
    drawHud();
    if (state === 'over') drawGameOver();
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  function reset() {
    stars = [];
    score = 0; caught = 0; lives = 3; level = 1;
    basket.x = W / 2;
    state = 'play';
  }

  function pointerMove(clientX) {
    const rect = canvas.getBoundingClientRect();
    basket.x = ((clientX - rect.left) / rect.width) * W;
  }

  canvas.addEventListener('pointermove', (e) => pointerMove(e.clientX));
  canvas.addEventListener('pointerdown', (e) => {
    if (state === 'over') reset();
    pointerMove(e.clientX);
  });
  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (state === 'over' && (e.key === 'r' || e.key === 'R' || e.key === 'Enter')) reset();
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  loop();
</script>
</body>
</html>
